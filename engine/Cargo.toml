[package]
name = "circuit_engine"
version = "0.2.0"
edition = "2021"

# One crate, three delivery targets (hybrid runtime):
#   native CLI      cargo build --release                       (default features)
#   Python module   cargo rustc --release --lib --crate-type cdylib --features python
#   WebAssembly     cargo rustc --release --lib --crate-type cdylib --target wasm32-unknown-unknown --no-default-features
# `circuit_simulator/build_engine.py` runs all three and copies the artifacts into place.

[features]
default = ["industrial"]
# Production sparse LU from the faer crate, offered next to the hand-written solvers.
industrial = ["dep:faer"]
python = ["dep:pyo3", "industrial"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faer = { version = "0.24", optional = true }
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py38", "generate-import-lib"] }

[profile.release]
lto = true
codegen-units = 1
